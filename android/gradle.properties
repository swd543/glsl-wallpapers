org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# No AndroidX — the app uses plain android.* framework classes only.
android.useAndroidX=false
kotlin.code.style=official

# Compile Kotlin in the Gradle daemon JVM: the standalone Kotlin daemon dies
# on startup on the GitHub runners ("terminated unexpectedly ... error code 0"),
# and in-process keeps one less JVM to flake on a tiny app.
kotlin.compiler.execution.strategy=in-process
